methodology: Comparative evaluation of SSVEP-based BCI algorithms using leave-one-subject-out cross-validation. The study
  examines filtering methods (IIR, FIR), artifact removal (AMUSE, ICA), feature extraction (Periodogram, Welch, Goertzel,
  Yule-AR, STFT, DWT), feature selection (Shannon entropy, PCA, ICA), and classification (LDA, SVM, kNN, Naive Bayes, Random
  Forest, CCA, ELM, Decision Trees). Each parameter is studied independently while keeping others fixed to identify optimal
  configurations.
