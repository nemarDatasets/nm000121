abstract: Brain-computer interfaces (BCIs) have been gaining momentum in making human-computer interaction more natural, especially
  for people with neuro-muscular disabilities. This report focuses on EEG-based BCIs that rely on Steady-State-Visual-Evoked
  Potentials (SSVEPs) and performs a comparative evaluation of state-of-the-art algorithms for filtering, artifact removal,
  feature extraction, feature selection and classification. The dataset consists of 256-channel EEG signals from 11 subjects,
  along with a processing toolbox for reproducing results.
